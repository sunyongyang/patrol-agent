# 巡逻 Agent Demo · 配置模板
#
# 复制成 config/config.yaml 后填入真实值：
#     copy config\config.example.yaml config\config.yaml
#
# config.yaml 已在 .gitignore 中，不会被提交。

# ------------------------------------------------------------ IM 通道
feishu:
  # 飞书开放平台 → 你的自建应用 → 凭证与基础信息
  app_id: "cli_xxxxxxxxxxxxxxxx"
  app_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  domain: "feishu"                  # feishu=飞书(国内) / lark=Lark(国际)
  group_response_mode: "mention"    # 群聊仅 @机器人 时响应

# ------------------------------------------------------------ 服务地址
robot_sim:
  base_url: "http://127.0.0.1:8100"

agent_service:
  port: 8200
  base_url: "http://127.0.0.1:8200"
  daily_report_time: "08:30"        # 每日日报推送时间
  daily_report_enabled: true
  internal_token: "change-me"       # 预留：内部回调鉴权

# ------------------------------------------------------------ LLM
# 任何 OpenAI 兼容接口都可以；DeepSeek 官方已验证支持 function calling
llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  model: "deepseek-chat"
  timeout_sec: 30
