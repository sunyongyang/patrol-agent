# 巡逻 Agent Demo · 算法定义与点位绑定
#
# 核心概念（对齐产品语境）：
#   **算法 = 一类检测能力**，有名字、有对应的模型类别、有映射出的告警语义。
#   **点位绑定一个算法**，该点位**只上报这个算法的检测结果**，
#   其它类别即使被模型检出也不进上报链路（见下方 detector 配置）。
#
# 改配置即可改业务，不动代码。

algorithms:
  person_intrusion:
    name: "人员闯入检测"
    coco_label: "person"          # 对应 YOLO COCO 类别
    alert_type: "人员闯入"
    level: "紧急"
    level_code: "urgent"
    push: true
    emoji: "👤"
    # 「闯入」本质是行为，COCO 只给 person 框。此处是规则近似，
    # 报表与卡片必须如实标注，不宣称具备行为识别能力。
    note: "规则近似：点位检出 person 且置信度达标即判定，未使用时序/姿态模型"

  corridor_occupancy:
    name: "通道占用检测"
    coco_label: "chair"
    alert_type: "通道占用"
    level: "一般"
    level_code: "normal"
    push: true
    emoji: "🚧"
    # 对应七大场景里的「通道堆堵塞」。
    # 椅子的视觉本质是「占据通行空间的物体」，映射到通道占用比遗留物更贴切。
    note: "代理目标：以 chair 代表占用通道的堆积物，COCO 无原生「通道占用」类别"

# 检测管道参数
detector:
  conf_floor: 0.35          # 低于此置信度的结果直接丢弃
  model: "yolov8n.pt"
  allow_mock_fallback: true # 未安装 ultralytics 时降级为模拟检测并标注 is_mock

  # —— 绑定关系的作用范围 ——
  #
  # 业务要求：点位绑定了谁，就只上报对应的检测结果。
  #
  # show_other_detections
  #   算法结果图上是否绘制**非绑定算法**的检测框。
  #   false（默认）= 图上只有该点位绑定算法的框，符合「点位只上报绑定算法结果」。
  #   本机实测 P2 会同时检出 person 0.92 与 chair 0.46，
  #   开着的话图上会出现一个灰框 person，与「该点位只做通道占用检测」矛盾。
  show_other_detections: false
  #
  # store_all_classes
  #   检测表里是否保留非绑定算法的原始输出。
  #   true（默认）= 全部落库。注意这**不是「上报」**，只是内部留档：
  #     客户追问「那个点位当时到底看到什么」时能答得出来。
  #     上报给用户的告警与结果图始终只看绑定算法。
  #   若希望数据模型严格做到「一个点位只有一种算法的数据」，改成 false。
  store_all_classes: true

# 告警抑制策略
#
# 为什么必须有这一层：
#   没有它，同一个人一直站在摄像头前，每次巡逻都会新建一条「人员闯入」——
#   实测 10 条真实告警里 9 条是同一个人在同一个点位的重复报警，
#   值班员会被淹没，真正的新告警反而看不见。
#
# 规则：同一 (点位, 告警类型) 在 suppress_minutes 内已有「待处置」告警时，
#       不新建，而是累加出现次数 + 更新最后出现时间，并就地刷新原卡片。
alert_policy:
  suppress_minutes: 30
  update_card_on_suppress: true
